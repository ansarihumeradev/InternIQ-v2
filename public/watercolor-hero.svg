<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- watercolor edge: turbulence-displaced + softened -->
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="16"/>
    </filter>
    <filter id="washSoft" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7"/>
    </filter>
    <filter id="dot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 0.09 0"/>
    </filter>
    <!-- keep the middle calm so text stays readable -->
    <radialGradient id="calm" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#FBFDFC" stop-opacity="0.96"/>
      <stop offset="0.55" stop-color="#FBFDFC" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FBFDFC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1672" height="941" fill="#FBFDFC"/>

  <!-- TOP LEFT: fresh green -->
  <g filter="url(#wash)">
    <ellipse cx="90" cy="120" rx="300" ry="170" fill="#A8DA8B" opacity="0.62"/>
    <ellipse cx="210" cy="60" rx="220" ry="110" fill="#C4E8A8" opacity="0.55"/>
    <ellipse cx="40" cy="330" rx="200" ry="120" fill="#B9E6C4" opacity="0.55"/>
    <ellipse cx="300" cy="210" rx="120" ry="70" fill="#D2EEB8" opacity="0.5"/>
  </g>

  <!-- TOP RIGHT: powder blue + lavender -->
  <g filter="url(#wash)">
    <ellipse cx="1580" cy="150" rx="300" ry="190" fill="#9CCBF2" opacity="0.6"/>
    <ellipse cx="1400" cy="30" rx="260" ry="110" fill="#CFC5F2" opacity="0.5"/>
    <ellipse cx="1640" cy="360" rx="170" ry="110" fill="#B5D8F6" opacity="0.5"/>
    <ellipse cx="1290" cy="130" rx="110" ry="60" fill="#BFE0F7" opacity="0.45"/>
  </g>

  <!-- MID LEFT / RIGHT: pale mint and blue -->
  <g filter="url(#wash)">
    <ellipse cx="110" cy="590" rx="260" ry="190" fill="#CDEBC3" opacity="0.6"/>
    <ellipse cx="40" cy="760" rx="200" ry="130" fill="#BEE0F5" opacity="0.5"/>
    <ellipse cx="1610" cy="520" rx="200" ry="160" fill="#C4E0F7" opacity="0.5"/>
  </g>

  <!-- BOTTOM WAVES -->
  <g filter="url(#washSoft)">
    <path d="M-40 800 C 180 720, 420 790, 640 850 C 820 900, 1000 900, 1180 870 L1180 1000 L-40 1000 Z" fill="#A6D9A0" opacity="0.5"/>
    <path d="M300 900 C 560 830, 820 880, 1080 900 C 1260 912, 1400 880, 1500 850 L1500 1000 L300 1000 Z" fill="#A9D3F0" opacity="0.55"/>
    <path d="M1180 900 C 1330 800, 1500 690, 1720 660 L1720 1000 L1180 1000 Z" fill="#8CCB8F" opacity="0.62"/>
    <path d="M1400 940 C 1500 820, 1600 760, 1720 740 L1720 1000 L1400 1000 Z" fill="#B8E0AE" opacity="0.6"/>
  </g>

  <!-- calm centre so the headline stays crisp -->
  <rect width="1672" height="941" fill="url(#calm)"/>

  <!-- splatter dots -->
  <g filter="url(#dot)" opacity="0.55">
    <circle cx="34" cy="474" r="8" fill="#A8DA8B"/>
    <circle cx="36" cy="506" r="12" fill="#B9E6C4"/>
    <circle cx="34" cy="546" r="7" fill="#BEE0F5"/>
    <circle cx="58" cy="572" r="5" fill="#A8DA8B"/>
    <circle cx="1543" cy="620" r="9" fill="#A9D3F0"/>
    <circle cx="1480" cy="606" r="6" fill="#CFC5F2"/>
    <circle cx="260" cy="430" r="5" fill="#B9E6C4"/>
    <circle cx="1366" cy="572" r="4" fill="#BEE0F5"/>
  </g>

  <!-- paper grain -->
  <rect width="1672" height="941" filter="url(#grain)"/>
</svg>
